<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<style>
  body { font: 12px/1.5 Inter, system-ui, sans-serif; margin: 20px; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 8px 0 14px; }
  label { display: block; margin-bottom: 6px; }
  input, select { box-sizing: border-box; width: 100%; padding: 9px; border: 1px solid #aaa; border-radius: 6px; }
  button { margin-top: 10px; padding: 9px 14px; background: #2563eb; color: white; border: 0; border-radius: 6px; cursor: pointer; }
  #disconnect { background: #666; }
  #status { margin-top: 16px; overflow-wrap: anywhere; }
  #activity { opacity: .7; font-size: 11px; }
</style>
<h1>Figma Local MCP</h1>
<p id="intro">Откройте <b>get_connection</b> в MCP-клиенте и вставьте код подключения.</p>
<div id="pairing">
<label for="token">Код подключения</label>
<input id="token" type="password" placeholder="pairingCode" autocomplete="off" spellcheck="false">
</div>
<button id="connect">Подключить</button>
<button id="disconnect" hidden>Отключить</button>
<div id="status" role="status">Ожидание подключения</div>
<p id="activity">Держите это окно открытым во время работы.</p>
<label for="file-plan">Тариф команды этого файла</label>
<select id="file-plan">
  <option value="unknown">Неизвестен — до 3 страниц</option>
  <option value="starter">Starter</option>
  <option value="professional">Professional</option>
  <option value="education">Education</option>
  <option value="organization">Organization</option>
  <option value="enterprise">Enterprise</option>
</select>
<p id="page-budget">Тариф недоступен через Plugin API. Можно указать его вручную.</p>
<script>
  const installationToken = '';
  const status = document.getElementById('status');
  const activity = document.getElementById('activity');
  const connect = document.getElementById('connect');
  const disconnect = document.getElementById('disconnect');
  const filePlan = document.getElementById('file-plan');
  const pageBudget = document.getElementById('page-budget');
  filePlan.onchange = () => parent.postMessage({ pluginMessage: { type: 'set-plan', plan: filePlan.value } }, '*');
  let socket;
  let documentInfo;
  let activeRequest;
  let responseSocket;
  let retryTimer;
  let retryDelay = 1000;
  let stopped = false;
  let authenticatedSocket;
  if (installationToken) {
    document.getElementById('pairing').hidden = true;
    document.getElementById('intro').textContent = 'Автоматическое подключение к MCP на этом компьютере.';
  }
  function scheduleReconnect() {
    if (!installationToken || stopped || activeRequest || retryTimer) return;
    retryTimer = setTimeout(() => { retryTimer = undefined; connectToBridge(); }, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 10000);
  }
  function connectToBridge() {
    const token = installationToken || document.getElementById('token').value.trim();
    if (!/^[a-f0-9]{64}$/.test(token)) { status.textContent = 'Вставьте полный pairingCode из get_connection'; return; }
    if (activeRequest) { status.textContent = 'Дождитесь завершения текущей операции'; return; }
    clearTimeout(retryTimer);
    retryTimer = undefined;
    if (socket) { const previous = socket; socket = undefined; previous.close(); }
    const current = new WebSocket('ws://localhost:3055');
    socket = current;
    status.textContent = 'Подключение…';
    connect.disabled = true;
    disconnect.hidden = false;
    current.onopen = () => current.send(JSON.stringify({ type: 'hello', token, document: documentInfo }));
    current.onmessage = event => {
      if (socket !== current) return;
      let message;
      try { message = JSON.parse(event.data); } catch { current.close(); return; }
      if (!message || typeof message !== 'object') { current.close(); return; }
      if (message.type === 'ready') {
        authenticatedSocket = current;
        retryDelay = 1000;
        status.textContent = 'Подключено. MCP может читать и редактировать этот файл.';
        disconnect.hidden = false;
        document.getElementById('token').value = '';
      } else if (message.type === 'command') {
        if (activeRequest) {
          current.send(JSON.stringify({ type: 'result', id: message.id, error: 'Plugin busy' })); return;
        }
        activeRequest = message.id;
        filePlan.disabled = true;
        responseSocket = current;
        activity.textContent = 'Выполняется: ' + message.command;
        parent.postMessage({ pluginMessage: message }, '*');
      }
    };
    current.onclose = event => {
      if (socket !== current) return;
      status.textContent = 'Отключено' + (event.reason ? ': ' + event.reason : '. Вызовите get_connection и подключитесь снова.');
      connect.disabled = false;
      disconnect.hidden = true;
      if (event.code === 1008) stopped = true;
      if (installationToken && !stopped) {
        status.textContent = activeRequest ? 'Связь потеряна. Ожидаем завершения операции; повторно она не отправляется.' : 'Ожидаем локальный MCP. Подключение восстановится автоматически.';
        disconnect.hidden = false;
        scheduleReconnect();
      }
    };
    current.onerror = () => { if (socket === current) status.textContent = 'Нет соединения с локальным MCP на порту 3055'; };
  }
  connect.onclick = () => { stopped = false; connectToBridge(); };
  disconnect.onclick = () => {
    stopped = true;
    clearTimeout(retryTimer);
    retryTimer = undefined;
    socket?.close();
    disconnect.hidden = true;
    status.textContent = 'Отключено';
  };
  function base64FromBytes(bytes) {
    const chunk = 0x8000;
    const parts = [];
    for (let offset = 0; offset < bytes.length; offset += chunk) {
      parts.push(String.fromCharCode(...bytes.subarray(offset, Math.min(offset + chunk, bytes.length))));
    }
    return btoa(parts.join(''));
  }
  async function normalizeImage(message) {
    try {
      const response = await fetch('data:' + (message.mimeType || 'application/octet-stream') + ';base64,' + message.base64);
      const blob = await response.blob();
      const bitmap = await createImageBitmap(blob);
      const scale = Math.min(1, 4096 / Math.max(bitmap.width, bitmap.height));
      const width = Math.max(1, Math.round(bitmap.width * scale));
      const height = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      if (!context) throw new Error('Canvas is unavailable in the Figma plugin UI');
      context.drawImage(bitmap, 0, 0, width, height);
      bitmap.close?.();
      const png = await new Promise((resolve, reject) => canvas.toBlob(value => value ? resolve(value) : reject(new Error('Canvas PNG encoding failed')), 'image/png'));
      const bytes = new Uint8Array(await png.arrayBuffer());
      parent.postMessage({ pluginMessage: { type: 'decode-image-result', id: message.id, base64: base64FromBytes(bytes) } }, '*');
    } catch (error) {
      parent.postMessage({ pluginMessage: { type: 'decode-image-result', id: message.id,
        error: error instanceof Error ? error.message : String(error) } }, '*');
    }
  }
  window.onmessage = event => {
    // Figma Desktop can deliver plugin messages with a null event.source.
    // Correlate results with the active request instead of checking Window identity.
    const message = event.data?.pluginMessage;
    if (!message) return;
    if (message.type === 'decode-image' && typeof message.id === 'string' && typeof message.base64 === 'string') {
      void normalizeImage(message);
      return;
    }
    if (message.type === 'document') {
      documentInfo = message.document;
      const capability = documentInfo?.capabilities;
      if (capability) {
        filePlan.value = capability.plan;
        const limit = capability.effectivePageLimit === null ? 'без лимита по указанному тарифу' : 'предел ' + capability.effectivePageLimit;
        pageBudget.textContent = 'Страниц: ' + capability.pageCount + '; ' + limit + '. ' +
          (capability.planSource === 'figma_error' ? 'Ограничение подтверждено Figma.' : capability.plan === 'unknown' ? 'Тариф не определён; используем существующие страницы.' : 'Тариф указан вручную для этого файла.');
      }
      if (socket === authenticatedSocket && socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'document', document: documentInfo }));
      if (installationToken && !socket && !stopped) connectToBridge();
    }
    if (message.type === 'policy-error') { pageBudget.textContent = message.error; parent.postMessage({ pluginMessage: { type: 'init' } }, '*'); }
    if (message.type === 'result' && activeRequest && message.id === activeRequest) {
      if (responseSocket?.readyState === WebSocket.OPEN) responseSocket.send(JSON.stringify(message));
      activeRequest = undefined;
      filePlan.disabled = false;
      responseSocket = undefined;
      activity.textContent = message.error ? 'Ошибка: ' + message.error : 'Операция завершена';
      if (socket?.readyState === WebSocket.CLOSED) scheduleReconnect();
    }
  };
  parent.postMessage({ pluginMessage: { type: 'init' } }, '*');
</script>
</html>
