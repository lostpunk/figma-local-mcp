name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          if npm ci > "$RUNNER_TEMP/npm-ci.log" 2>&1; then
            cat "$RUNNER_TEMP/npm-ci.log"
          else
            cat "$RUNNER_TEMP/npm-ci.log"
            python3 - <<'PYERROR'
          import os, pathlib
          lines = pathlib.Path(os.environ['RUNNER_TEMP'], 'npm-ci.log').read_text().splitlines()
          errors = [line for line in lines if line.startswith(('npm error', 'npm ERR!'))]
          message = '\n'.join(errors[-30:] or lines[-20:])
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Dependency installation failed::' + message)
          PYERROR
            exit 1
          fi
      - run: npm test
      - run: npm run pack:skillstore
